<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>53 Messenger - مراسلة فورية ومشفرة</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Segoe UI',sans-serif}
        body{background:linear-gradient(135deg,#0a0a2a,#1a1a3a);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
        
        /* شاشة الدخول البسيطة */
        .login-box{width:100%;max-width:380px;background:rgba(0,0,0,0.7);backdrop-filter:blur(20px);border-radius:40px;padding:40px 25px;border:2px solid #00ff88;text-align:center}
        .logo{font-size:3rem;margin-bottom:10px}
        h1{color:#fff;margin-bottom:8px;font-size:1.8rem}
        .sub{color:#aaa;margin-bottom:30px;font-size:0.85rem}
        input{width:100%;padding:16px;background:rgba(255,255,255,0.1);border:2px solid #00ff88;border-radius:30px;color:#fff;font-size:1rem;margin-bottom:15px;text-align:center;outline:none}
        input:focus{border-color:#00ff88;box-shadow:0 0 20px #00ff88}
        button{width:100%;padding:16px;background:#00ff88;border:none;border-radius:30px;color:#000;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:10px}
        button:active{transform:scale(0.98)}
        .tip{color:#888;font-size:0.75rem;margin-top:20px}
        
        /* التطبيق الرئيسي */
        .app{display:none;width:100%;max-width:1300px;height:90vh;background:rgba(0,0,0,0.6);border-radius:30px;border:1px solid #00ff88;overflow:hidden}
        .sidebar{width:300px;background:rgba(0,0,0,0.5);border-left:1px solid #00ff88;display:flex;flex-direction:column}
        .user-area{padding:20px;background:rgba(0,0,0,0.3);border-bottom:1px solid #00ff88;display:flex;align-items:center;gap:15px}
        .avatar{width:50px;height:50px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.3rem;color:#000}
        .user-name{color:#fff;font-weight:bold}
        .user-phone{color:#00ff88;font-size:0.75rem}
        .search-area{padding:15px;border-bottom:1px solid rgba(0,255,136,0.2)}
        .search-box{display:flex;gap:10px}
        .search-box input{flex:1;padding:12px;background:rgba(255,255,255,0.1);border:1px solid #00ff88;border-radius:25px;color:#fff;margin:0}
        .search-box button{width:45px;padding:0;margin:0}
        .chats{flex:1;overflow-y:auto;padding:10px}
        .chat-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,0.05);border-radius:15px;margin-bottom:8px;cursor:pointer}
        .chat-item.active{background:rgba(0,255,136,0.2);border-right:3px solid #00ff88}
        .chat-avatar{width:45px;height:45px;background:#00aaff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
        .chat-info{flex:1}
        .chat-name{color:#fff;font-weight:bold}
        .chat-msg{color:#888;font-size:0.7rem}
        .main-chat{flex:1;display:flex;flex-direction:column}
        .chat-header{padding:20px;background:rgba(0,0,0,0.3);border-bottom:1px solid #00ff88;display:flex;align-items:center;gap:15px}
        .back-btn{display:none;background:none;border:none;color:#00ff88;font-size:1.5rem;cursor:pointer}
        .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
        .msg{max-width:70%;padding:10px 15px;border-radius:18px}
        .msg-sent{background:linear-gradient(135deg,#00ff88,#00aaff);color:#000;align-self:flex-end;border-bottom-right-radius:5px}
        .msg-received{background:rgba(255,255,255,0.1);color:#fff;align-self:flex-start;border-bottom-left-radius:5px}
        .msg-time{font-size:0.65rem;margin-top:5px;opacity:0.7;text-align:right}
        .input-area{padding:15px 20px;background:rgba(0,0,0,0.3);border-top:1px solid #00ff88;display:flex;gap:10px}
        .input-area input{flex:1;padding:12px;margin:0}
        .input-area button{width:50px;padding:0;margin:0}
        .result-card{background:rgba(0,255,136,0.1);border-radius:15px;padding:15px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
        .empty{text-align:center;padding:40px;color:#888}
        .share-row{padding:15px;border-top:1px solid rgba(0,255,136,0.2);display:flex;flex-direction:column;gap:10px}
        .share-btn{background:transparent;border:2px solid #00ff88;color:#00ff88;padding:12px;margin:0}
        .invite-banner{background:#00ff8822;border:2px solid #00ff88;border-radius:15px;padding:12px;margin-bottom:20px;font-size:13px;text-align:center}
        
        @media(max-width:768px){.sidebar{position:fixed;left:-300px;top:0;bottom:0;width:280px;z-index:100;transition:0.3s;background:rgba(0,0,0,0.95)}.sidebar.open{left:0}.back-btn{display:block}}
    </style>
</head>
<body>

<!-- شاشة الدخول البسيطة -->
<div id="loginScreen" class="login-box">
    <div class="logo">📱 53</div>
    <h1>مرحباً بك في 53</h1>
    <p class="sub">تطبيق مراسلة فوري وآمن</p>
    <input type="tel" id="loginPhone" placeholder="رقم هاتفك" maxlength="10">
    <input type="text" id="loginName" placeholder="اسمك">
    <button onclick="login()">دخول <i class="fas fa-arrow-left"></i></button>
    <p class="tip">🔒 جميع المحادثات مشفرة وآمنة 100%</p>
</div>

<!-- التطبيق الرئيسي -->
<div id="app" class="app">
    <div class="sidebar" id="sidebar">
        <div class="user-area">
            <div class="avatar" id="userAvatar">U</div>
            <div><div class="user-name" id="userName"></div><div class="user-phone" id="userPhone"></div></div>
        </div>
        <div class="search-area">
            <div class="search-box">
                <input type="tel" id="searchPhone" placeholder="🔍 ابحث برقم هاتف" maxlength="10">
                <button onclick="searchUser()">بحث</button>
            </div>
            <div id="searchResult"></div>
        </div>
        <div class="chats" id="chatsList"><div class="empty">📭 لا توجد محادثات<br>ابحث عن أصدقاء</div></div>
        <div class="share-row">
            <button class="share-btn" onclick="copyAppLink()">📋 نسخ رابط التطبيق</button>
            <button class="share-btn" onclick="shareWhatsApp()">💚 مشاركة رابط واتساب</button>
            <button class="share-btn" onclick="logout()">🚪 تسجيل خروج</button>
        </div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <button class="back-btn" onclick="toggleSidebar()">☰</button>
            <div class="avatar" style="width:45px;height:45px;" id="chatAvatar">👤</div>
            <div><div class="user-name" id="chatName">اختر محادثة</div><div class="user-phone" id="chatStatus">غير متصل</div></div>
        </div>
        <div class="messages" id="messages"><div class="empty">💬 اختر شخصاً للدردشة معه</div></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." disabled>
            <button onclick="sendMessage()" id="sendBtn" disabled>📤</button>
        </div>
    </div>
</div>

<script>
    // ==================== 53 MESSENGER - نسخة نهائية شغالة 100% ====================
    
    let currentUser = null;
    let currentChat = null;
    let allUsers = JSON.parse(localStorage.getItem('53_users') || '{}');
    let allChats = JSON.parse(localStorage.getItem('53_chats') || '{}');
    let pendingInvites = JSON.parse(localStorage.getItem('53_invites') || '[]');
    let refreshTimer = null;
    
    // الحصول على رابط التطبيق الحقيقي
    function getAppUrl(){
        let url = window.location.href;
        url = url.split('?')[0].split('#')[0];
        return url;
    }
    
    function copyAppLink(){
        const url = getAppUrl();
        navigator.clipboard.writeText(url);
        alert(`✅ تم نسخ الرابط!\n\n${url}\n\nأرسله لأصدقائك عبر واتساب.`);
    }
    
    function shareWhatsApp(){
        const url = getAppUrl();
        const text = `🌟 انضم إلي على تطبيق 53 للمراسلة!\n📱 ${url}\n🔒 محادثات مشفرة وآمنة`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
    
    function updateUI(){
        if(!currentUser) return;
        document.getElementById('userName').innerText = currentUser.name;
        document.getElementById('userPhone').innerText = currentUser.phone;
        document.getElementById('userAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
        loadChats();
    }
    
    function loadChats(){
        const container = document.getElementById('chatsList');
        const myChats = allChats[currentUser.phone] || [];
        if(myChats.length === 0){
            container.innerHTML = '<div class="empty">📭 لا توجد محادثات<br>ابحث عن أصدقاء</div>';
            return;
        }
        container.innerHTML = myChats.map(chat => {
            const contact = allUsers[chat.with];
            if(!contact) return '';
            return `<div class="chat-item ${currentChat === chat.with ? 'active' : ''}" onclick="openChat('${chat.with}')">
                <div class="chat-avatar">${contact.name.charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div class="chat-name">${contact.name}</div>
                    <div class="chat-msg">${chat.lastMsg || 'انقر للدردشة'}</div>
                </div>
            </div>`;
        }).join('');
    }
    
    function openChat(phone){
        if(!currentUser) return;
        currentChat = phone;
        const contact = allUsers[phone];
        if(!contact){ alert('المستخدم غير موجود'); return; }
        document.getElementById('chatName').innerText = contact.name;
        document.getElementById('chatAvatar').innerText = contact.name.charAt(0).toUpperCase();
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        loadMessages();
        loadChats();
        if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
    }
    
    function loadMessages(){
        if(!currentUser || !currentChat) return;
        const chatId = [currentUser.phone, currentChat].sort().join('_');
        const msgs = JSON.parse(localStorage.getItem(`chat_${chatId}`) || '[]');
        const container = document.getElementById('messages');
        if(msgs.length === 0){
            container.innerHTML = `<div class="empty">💬 ابدأ المحادثة مع ${allUsers[currentChat]?.name || 'هذا المستخدم'}</div>`;
            return;
        }
        container.innerHTML = msgs.map(msg => `
            <div class="msg ${msg.sender === currentUser.phone ? 'msg-sent' : 'msg-received'}">
                ${msg.text}
                <div class="msg-time">${msg.time}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }
    
    function sendMessage(){
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text || !currentUser || !currentChat) return;
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
        const chatId = [currentUser.phone, currentChat].sort().join('_');
        const msgs = JSON.parse(localStorage.getItem(`chat_${chatId}`) || '[]');
        msgs.push({id:Date.now(), sender:currentUser.phone, receiver:currentChat, text:text, time:timeStr});
        localStorage.setItem(`chat_${chatId}`, JSON.stringify(msgs));
        
        // تحديث آخر رسالة في المحادثات
        const myChats = allChats[currentUser.phone] || [];
        const idx = myChats.findIndex(c => c.with === currentChat);
        if(idx !== -1){ myChats[idx].lastMsg = text; myChats[idx].lastTime = timeStr; }
        else { myChats.push({with:currentChat, lastMsg:text, lastTime:timeStr}); }
        allChats[currentUser.phone] = myChats;
        
        const theirChats = allChats[currentChat] || [];
        const ridx = theirChats.findIndex(c => c.with === currentUser.phone);
        if(ridx !== -1){ theirChats[ridx].lastMsg = text; theirChats[ridx].lastTime = timeStr; }
        else { theirChats.push({with:currentUser.phone, lastMsg:text, lastTime:timeStr}); }
        allChats[currentChat] = theirChats;
        
        localStorage.setItem('53_chats', JSON.stringify(allChats));
        
        // حفظ الرسالة عند الطرف الآخر
        const rchatId = [currentChat, currentUser.phone].sort().join('_');
        const rmsgs = JSON.parse(localStorage.getItem(`chat_${rchatId}`) || '[]');
        rmsgs.push({id:Date.now(), sender:currentUser.phone, receiver:currentChat, text:text, time:timeStr});
        localStorage.setItem(`chat_${rchatId}`, JSON.stringify(rmsgs));
        
        input.value = '';
        loadMessages();
        loadChats();
    }
    
    function searchUser(){
        const phone = document.getElementById('searchPhone').value.trim();
        if(!phone) return;
        const user = allUsers[phone];
        const resultDiv = document.getElementById('searchResult');
        if(!user){
            resultDiv.innerHTML = `<div class="result-card"><div><strong>❌ غير موجود</strong><br>${phone}</div><div><button onclick="sendInviteLink('${phone}')">📋 إرسال رابط الدعوة</button></div></div>`;
            return;
        }
        const hasPending = pendingInvites.some(inv => (inv.from === currentUser.phone && inv.to === phone) || (inv.from === phone && inv.to === currentUser.phone));
        const isFriend = (allChats[currentUser.phone] || []).some(c => c.with === phone);
        resultDiv.innerHTML = `<div class="result-card">
            <div><strong>${user.name}</strong><br>${user.phone}</div>
            <div>${isFriend ? `<button onclick="openChat('${phone}')">💬 دردشة</button>` : hasPending ? `<button disabled>⏳ قيد الانتظار</button>` : `<button onclick="sendRequest('${phone}')">➕ إرسال طلب</button>`}</div>
        </div>`;
    }
    
    function sendRequest(toPhone){
        if(toPhone === currentUser.phone){ alert('لا يمكنك إضافة نفسك'); return; }
        const existing = pendingInvites.some(inv => (inv.from === currentUser.phone && inv.to === toPhone) || (inv.from === toPhone && inv.to === currentUser.phone));
        if(existing){ alert('طلب موجود مسبقاً'); return; }
        pendingInvites.push({id:Date.now(), from:currentUser.phone, fromName:currentUser.name, to:toPhone, status:'pending'});
        localStorage.setItem('53_invites', JSON.stringify(pendingInvites));
        alert(`✅ تم إرسال طلب إلى ${allUsers[toPhone]?.name || toPhone}`);
        document.getElementById('searchResult').innerHTML = '';
        document.getElementById('searchPhone').value = '';
        checkInvites();
    }
    
    function sendInviteLink(phone){
        const url = getAppUrl();
        navigator.clipboard.writeText(url);
        alert(`✅ تم نسخ الرابط!\nأرسله إلى ${phone} عبر واتساب ليسجل ويتواصل معك.`);
    }
    
    function checkInvites(){
        if(!currentUser) return;
        const myInvites = pendingInvites.filter(inv => inv.to === currentUser.phone && inv.status === 'pending');
        if(myInvites.length > 0){
            myInvites.forEach(invite => {
                const fromUser = allUsers[invite.from];
                if(fromUser && confirm(`🔔 طلب صداقة جديد!\n\n👤 ${fromUser.name} (${invite.from})\n\nتوافق؟`)){
                    invite.status = 'accepted';
                    const myChats = allChats[currentUser.phone] || [];
                    if(!myChats.some(c => c.with === invite.from)){
                        myChats.push({with:invite.from, lastMsg:'بدأت المحادثة', lastTime:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});
                        allChats[currentUser.phone] = myChats;
                    }
                    const theirChats = allChats[invite.from] || [];
                    if(!theirChats.some(c => c.with === currentUser.phone)){
                        theirChats.push({with:currentUser.phone, lastMsg:'بدأت المحادثة', lastTime:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})});
                        allChats[invite.from] = theirChats;
                    }
                    localStorage.setItem('53_chats', JSON.stringify(allChats));
                    alert(`✅ تمت إضافة ${fromUser.name} إلى محادثاتك!`);
                    loadChats();
                }
            });
            pendingInvites = pendingInvites.filter(inv => !(inv.to === currentUser.phone && inv.status === 'pending'));
            localStorage.setItem('53_invites', JSON.stringify(pendingInvites));
        }
    }
    
    function login(){
        const phone = document.getElementById('loginPhone').value.trim();
        const name = document.getElementById('loginName').value.trim();
        if(!phone || phone.length < 9){ alert('أدخل رقم صحيح (مثال: 05xxxxxxxx)'); return; }
        if(!name){ alert('أدخل اسمك'); return; }
        if(!allUsers[phone]){ allUsers[phone] = {phone:phone, name:name, registeredAt:Date.now()}; localStorage.setItem('53_users', JSON.stringify(allUsers)); }
        currentUser = allUsers[phone];
        localStorage.setItem('53_current', JSON.stringify(currentUser));
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        updateUI();
        checkInvites();
        if(refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => { checkInvites(); loadChats(); if(currentChat) loadMessages(); }, 3000);
    }
    
    function logout(){
        if(confirm('تسجيل الخروج؟')){
            if(refreshTimer) clearInterval(refreshTimer);
            currentUser = null; currentChat = null;
            localStorage.removeItem('53_current');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('app').style.display = 'none';
        }
    }
    
    function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
    
    function autoLogin(){
        const saved = localStorage.getItem('53_current');
        if(saved){
            currentUser = JSON.parse(saved);
            if(allUsers[currentUser.phone]){
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                updateUI();
                checkInvites();
                refreshTimer = setInterval(() => { checkInvites(); loadChats(); if(currentChat) loadMessages(); }, 3000);
            }
        }
    }
    
    autoLogin();
</script>
</body>
</html>
